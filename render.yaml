# Render.com Blueprint Specification for Bobby
# Free-tier deployment (<100MB RAM, $0/month)
services:
  - type: web
    name: bobby-engine
    runtime: python
    region: oregon
    plan: free
    rootDir: services/bobby-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_MIN_CLEARANCE_METERS
        value: "1.20"
