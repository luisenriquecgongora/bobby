[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bobby-engine"
version = "0.2.0"
description = "Authoritative 3D Spatial Validation, Collision Detection, and Algorithmic Wall Extrusion Engine for Bobby Venue Builder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Luis Enrique", email = "luisenriquecgongora@gmail.com" }
]
keywords = ["computational-geometry", "cad", "fastapi", "trimesh", "shapely", "spatial-validation"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "trimesh[easy]>=4.0.0",
    "shapely>=2.0.0",
    "scipy>=1.12.0",
    "networkx>=3.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Lint rules pinned here so CI and local runs agree regardless of personal configs.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
