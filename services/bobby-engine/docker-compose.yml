version: '3.8'

services:
  bobby-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bobby-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=false
      - DEFAULT_MIN_CLEARANCE_METERS=1.20
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3301,http://localhost:5173,http://tauri.localhost,*
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
